name: Actualizar Shows desde Notion

on:
  schedule:
    - cron: '0 6 * * *'   # Cada día a las 6:00 UTC, para quitar shows pasados a diario
  workflow_dispatch:        # También se puede lanzar manualmente

concurrency:
  group: update-web
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Actualizar shows desde Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/update-shows.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "Bot Daviz Garzia"
          git config user.email "bot@davizgarziamusic.com"
          git add shows.html
          git diff --staged --quiet || git commit -m "auto: actualizar próximas fechas desde Notion [$(date '+%Y-%m-%d')]"
          git pull --rebase origin main
          git push
