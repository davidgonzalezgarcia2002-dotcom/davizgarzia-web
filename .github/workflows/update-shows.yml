name: Actualizar Shows desde Notion

on:
  schedule:
    - cron: '0 6 * * *'   # Cada día a las 6:00 UTC, para quitar shows pasados a diario
  workflow_dispatch:        # También se puede lanzar manualmente

concurrency:
  group: update-web
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Actualizar shows desde Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/update-shows.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "Bot Daviz Garzia"
          git config user.email "bot@davizgarziamusic.com"
          git add shows.html index.html
          git diff --staged --quiet || git commit -m "auto: actualizar próximas fechas desde Notion [$(date '+%Y-%m-%d')]"
          git pull --rebase origin main
          git push

      - name: Avisar con un Issue si algo falló
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fallo en workflow "Actualizar Shows desde Notion" — ${new Date().toISOString().slice(0, 10)}`,
              body: `El job **${context.job}** ha fallado en la ejecución [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nRevisa el log del run para ver el error concreto.`,
              labels: ["bug", "automatizacion"]
            })
