name: Actualizar últimos vídeos de YouTube

on:
  schedule:
    # Todos los días a las 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: update-web
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer el último vídeo de cada canal
        run: python scripts/update_youtube.py
      - name: Commit y push si hay cambios
        run: |
          git config user.name "Daviz Garzia Bot"
          git config user.email "davidgonzalezgarcia2002@gmail.com"
          git add musica.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "🤖 Auto-update $(date -u '+%Y-%m-%d'): últimos vídeos de YouTube"
            git pull --rebase origin main
            git push
          fi
